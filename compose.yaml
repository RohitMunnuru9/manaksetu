services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: manaksetu
      POSTGRES_USER: manaksetu
      POSTGRES_PASSWORD: manaksetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manaksetu"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://manaksetu:manaksetu@db:5432/manaksetu
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: "20"
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      # Deliberately not defaulted. Left unset, the application generates an
      # ephemeral development secret at startup; sessions then end on restart.
      # Export JWT_SECRET (at least 32 random characters) before any shared
      # deployment -- outside development the API refuses to start without one.
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/change-this-password
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres_data:
  neo4j_data:
  ollama_data:
  uploads:
